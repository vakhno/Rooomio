name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_template
          POSTGRES_USER: app_template
          POSTGRES_PASSWORD: app_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_template -d app_template"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npm run playwright:install --workspace=@shared/e2e
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          MONGODB_URI: mongodb://127.0.0.1:27018
          POSTGRES_URL: postgresql://app_template:app_template@127.0.0.1:5432/app_template
